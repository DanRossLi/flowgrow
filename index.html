<body>
<!-- The bare address is a front door (LOU-316). The game is at play/; the test build (the rules, no graphics) is at test/. A link that carries rules or a seed (?treeShare=0, ?seed=7 ...) is a test link, so it goes to
     test/; every other link goes to play/. The query string and the hash are kept, so an old link still works. A run saved on this device is under the same keys on both addresses (the play page's), so it is not lost. -->
<p><a href="play/">Flowgrow</a></p>
<script>
(function () {
  var q = location.search, keys = q.replace(/^\?/, "").split("&").map(function (p) { return p.split("=")[0] }).filter(Boolean);
  var play = { look: 1, example: 1, dev: 1, q: 1, time: 1 }, test = keys.some(function (k) { return !play[k] });
  location.replace((test ? "test/" : "play/") + q + location.hash);
})();
</script>
</body>
